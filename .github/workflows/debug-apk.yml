# APK di prova: a ogni push (qualsiasi branch) o a mano compila la versione di debug ("myCimmena dev",
# it.mycimmena.app.debug) e la lascia come artifact per 14 giorni. Non tocca Release né chiave di release.
#
# Scaricarla e installarla sul telefono collegato (debug USB attivo):
#   gh run download --name mycimmena-dev --dir dist/dev
#   adb install -r dist/dev/app-debug.apk

name: APK di prova

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'release-notes/**', 'server/**']
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: mycimmena-dev
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
